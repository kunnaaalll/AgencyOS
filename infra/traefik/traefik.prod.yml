# ============================================================
# Traefik Static Configuration — AgencyOS V2.1 (Production)
# ============================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: WARN
  format: json

accessLog:
  format: json
  bufferingSize: 100
  fields:
    headers:
      names:
        X-Request-ID: keep
        User-Agent: keep

api:
  dashboard: true
  insecure: false  # Dashboard protected by auth middleware

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers@file
        - rate-limit@file
        - compress@file

# Let's Encrypt Certificate Resolver
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /certs/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# Metrics for Prometheus
metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# TLS minimum version
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
