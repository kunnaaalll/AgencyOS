# ============================================================
# Traefik Static Configuration — AgencyOS V2.1 (Development)
# ============================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      names:
        X-Request-ID: keep
        User-Agent: keep

api:
  dashboard: true
  insecure: true  # Development only — disabled in production

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: agencyos_agencyos
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# Metrics for Prometheus scraping
metrics:
  prometheus:
    entryPoint: web
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
