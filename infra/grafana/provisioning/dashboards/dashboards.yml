# ============================================================
# Grafana Dashboard Provisioning — AgencyOS V2.1
# ============================================================

apiVersion: 1

providers:
  - name: 'AgencyOS'
    orgId: 1
    folder: 'AgencyOS'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
