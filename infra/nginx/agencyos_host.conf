# ============================================================
# AgencyOS V2.1 — Host Nginx Configuration Template
# ============================================================
# Copy this file to your host Nginx config directory:
#   sudo cp infra/nginx/agencyos_host.conf /etc/nginx/sites-available/agencyos.conf
#   sudo ln -sf /etc/nginx/sites-available/agencyos.conf /etc/nginx/sites-enabled/agencyos.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── Unified Access (Cloudflare Tunnels, Localhost, Direct IP) ──
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # ── Backend Core API ─────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # ── Frontend Web Dashboard ───────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Dedicated Frontend Subdomain (app.YOUR_DOMAIN) ───────────
server {
    listen 80;
    server_name app.147.224.203.127.nip.io app.YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Dedicated Backend Subdomain (api.YOUR_DOMAIN) ────────────
server {
    listen 80;
    server_name api.147.224.203.127.nip.io api.YOUR_DOMAIN;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live pipeline updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
