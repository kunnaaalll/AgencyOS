# ============================================================
# AgencyOS V2.1 — Host Nginx Configuration Template
# ============================================================
# Copy this file to your host Nginx config directory:
#   sudo cp infra/nginx/agencyos_host.conf /etc/nginx/sites-available/agencyos.conf
#   sudo ln -s /etc/nginx/sites-available/agencyos.conf /etc/nginx/sites-enabled/
#
# Replace YOUR_DOMAIN with your actual domain or IP (e.g. 147.224.203.127.nip.io)
# Test & Reload Nginx without downtime to other sites:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Enable SSL via Certbot (optional):
#   sudo certbot --nginx -d app.YOUR_DOMAIN -d api.YOUR_DOMAIN
# ============================================================

# ── Frontend Dashboard (app.YOUR_DOMAIN) ─────────────────────
server {
    listen 80;
    server_name app.147.224.203.127.nip.io app.YOUR_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Backend Core API (api.YOUR_DOMAIN) ───────────────────────
server {
    listen 80;
    server_name api.147.224.203.127.nip.io api.YOUR_DOMAIN;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live pipeline updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
