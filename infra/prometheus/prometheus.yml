# ============================================================
# Prometheus Configuration — AgencyOS V2.1 (Production)
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Rules
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # ── Prometheus Self-Monitoring ────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── FastAPI Backend ───────────────────────────────────────
  - job_name: "agencyos-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Traefik ───────────────────────────────────────────────
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:80"]
    metrics_path: /metrics

  # ── Node Exporter (System Metrics) ────────────────────────
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s

  # ── PostgreSQL Exporter ───────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  # ── Redis Exporter ────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s
