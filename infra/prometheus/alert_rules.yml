# ============================================================
# Prometheus Alert Rules — AgencyOS V2.1
# ============================================================

groups:
  - name: service_alerts
    rules:
      # ── Service Down ────────────────────────────────────────
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes."

      # ── High Error Rate ─────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # ── Slow API Response ───────────────────────────────────
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="agencyos-backend"}[10m])) by (le))
          > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API P95 latency exceeds 500ms"
          description: "P95 latency is {{ $value }}s over the last 10 minutes."

  - name: infrastructure_alerts
    rules:
      # ── High CPU ────────────────────────────────────────────
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% for more than 5 minutes."

      # ── High Memory ─────────────────────────────────────────
      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% for more than 5 minutes."

      # ── Low Disk Space ──────────────────────────────────────
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"})) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk usage is {{ $value }}% on {{ $labels.mountpoint }}."

  - name: application_alerts
    rules:
      # ── Failed Background Jobs ──────────────────────────────
      - alert: HighJobFailureRate
        expr: |
          (
            sum(rate(arq_job_failures_total[15m]))
            /
            (sum(rate(arq_job_successes_total[15m])) + sum(rate(arq_job_failures_total[15m])))
          ) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ARQ worker job failure rate > 5%"
          description: "Job failure rate is {{ $value | humanizePercentage }} over the last 15 minutes."

      # ── PostgreSQL Connection Pool ──────────────────────────
      - alert: PostgresConnectionPoolExhausted
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "Active connections: {{ $value }}. Pool may be exhausted."

      # ── Redis Memory ────────────────────────────────────────
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 90%"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory."
