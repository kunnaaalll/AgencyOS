# ============================================================
# Alertmanager Configuration — AgencyOS V2.1
# Routes alerts to Telegram Bot
# ============================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://127.0.0.1:9093'
        send_resolved: true
        # To enable Telegram notifications, configure a telegram receiver below
        # and set receiver: 'telegram' in the route block.
  # - name: 'telegram'
  #   telegram_configs:
  #     - bot_token: '<YOUR_BOT_TOKEN>'
  #       chat_id: <YOUR_CHAT_ID_AS_INT>
  #       parse_mode: 'HTML'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
