# ============================================================
# AgencyOS V2.1 — Automatic Production Deployment
# Trigger: push to main branch and manual (workflow_dispatch)
# ============================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Google Cloud
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /opt/agencyos

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building and deploying ==="
            docker compose --env-file .env.production -f docker-compose.prod.yml build --no-cache
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            echo "=== Running migrations ==="
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "=== Waiting for health check ==="
            sleep 15

            echo "=== Verifying deployment ==="
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Deployment successful! Health check returned $HTTP_STATUS"
            else
              echo "❌ Deployment verification failed! Health check returned $HTTP_STATUS"
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=50 backend
              exit 1
            fi

      - name: Notify success
        if: success()
        run: |
          if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=✅ <b>AgencyOS Deployed</b>%0ACommit: ${{ github.sha }}%0ABy: ${{ github.actor }}" \
              -d "parse_mode=HTML"
          fi

      - name: Notify failure
        if: failure()
        run: |
          if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=❌ <b>AgencyOS Deploy FAILED</b>%0ACommit: ${{ github.sha }}%0ABy: ${{ github.actor }}" \
              -d "parse_mode=HTML"
          fi
