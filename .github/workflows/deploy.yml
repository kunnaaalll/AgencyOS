# ============================================================
# AgencyOS V2.1 — Manual Production Deployment
# Trigger: manual (workflow_dispatch) only — NO auto-deploy
# ============================================================

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /opt/agencyos

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building and deploying ==="
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            echo "=== Running migrations ==="
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "=== Waiting for health check ==="
            sleep 15

            echo "=== Verifying deployment ==="
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Deployment successful! Health check returned $HTTP_STATUS"
            else
              echo "❌ Deployment verification failed! Health check returned $HTTP_STATUS"
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              exit 1
            fi

      - name: Notify success
        if: success()
        run: |
          if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=✅ <b>AgencyOS Deployed</b>%0ACommit: ${{ github.sha }}%0ABy: ${{ github.actor }}" \
              -d "parse_mode=HTML"
          fi

      - name: Notify failure
        if: failure()
        run: |
          if [[ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=❌ <b>AgencyOS Deploy FAILED</b>%0ACommit: ${{ github.sha }}%0ABy: ${{ github.actor }}" \
              -d "parse_mode=HTML"
          fi
