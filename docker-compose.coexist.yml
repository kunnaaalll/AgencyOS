# ============================================================
# AgencyOS V2.1 — Safe Coexistence Mode Override
# ============================================================
# Purpose:
#   Run AgencyOS on a server with existing active websites/apps.
#   - NEVER binds to public ports 80 or 443 (Traefik disabled).
#   - Exposes Frontend & Backend ONLY on internal loopback (127.0.0.1).
#   - Zero port conflicts with host Nginx/Apache/Caddy/Postgres/Redis.
#   - Memory & CPU resource limits strictly enforced.
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.prod.yml -f docker-compose.coexist.yml up -d
# ============================================================

services:

  # ── Disable Standalone Traefik ──────────────────────────────
  traefik:
    deploy:
      replicas: 0
    ports: []

  # ── Expose Frontend to Localhost ONLY ───────────────────────
  frontend:
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:8188:80}"

  # ── Expose Backend API to Localhost ONLY ────────────────────
  backend:
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8100:8000}"

  # ── Disable Heavy Monitoring Stack (Preserves Host RAM & CPU) ──
  prometheus:
    deploy:
      replicas: 0

  grafana:
    deploy:
      replicas: 0

  loki:
    deploy:
      replicas: 0

  promtail:
    deploy:
      replicas: 0

  alertmanager:
    deploy:
      replicas: 0

  node-exporter:
    deploy:
      replicas: 0

  postgres-exporter:
    deploy:
      replicas: 0

  redis-exporter:
    deploy:
      replicas: 0
