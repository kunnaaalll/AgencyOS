[project]
name = "agencyos-backend"
version = "2.0.0"
description = "AgencyOS V2 Backend Service"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    # Redis / Worker Queue
    "redis>=5.2.0",
    "arq>=0.26.0",
    # MinIO
    "minio>=7.2.0",
    # Meilisearch
    "meilisearch>=0.31.0",
    # HTTP Client
    "httpx>=0.27.0",
    # Utilities
    "python-slugify>=8.0.4",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "playwright>=1.60.0",
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "trafilatura>=1.9.0",
    "lxml>=5.0.0",
    "phonenumbers>=8.13.0",
    # Security
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1.0",
    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",
    "crawl4ai>=0.9.0",
    "litellm>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=28.0.0",
    # Security scanning
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
    "B904",  # raise from in except
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "ARG"
]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "domain", "repositories", "services", "events", "workers", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "scripts/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
[tool.hatch.build.targets.wheel]
packages = ["api", "core", "domain", "events", "repositories", "scripts", "services", "utils", "workers"]
